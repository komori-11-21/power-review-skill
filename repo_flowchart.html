<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>d:\Assistant（power-review）仓库全貌与详细流程图</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-muted: #f1f5f9;
      --border: #e2e8f0;
      --fg: #0f172a;
      --muted: #475569;
      --placeholder: #94a3b8;
      --primary: #2563eb;
      --primary-fg: #ffffff;
      --success: #16a34a;
      --warning: #d97706;
      --chart-1: #2563eb;
      --chart-2: #0891b2;
      --chart-3: #dc2626;
      --chart-4: #7c3aed;
      --chart-5: #0d9488;
    }

    html.dark {
      --bg: #0b1120;
      --card: #111827;
      --card-muted: #1e293b;
      --border: #334155;
      --fg: #f1f5f9;
      --muted: #cbd5e1;
      --placeholder: #64748b;
      --primary: #3b82f6;
      --primary-fg: #ffffff;
      --success: #22c55e;
      --warning: #f59e0b;
      --chart-1: #60a5fa;
      --chart-2: #22d3ee;
      --chart-3: #f87171;
      --chart-4: #a78bfa;
      --chart-5: #2dd4bf;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    .container {
      max-width: 1260px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .title-group h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .title-group p {
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      padding: 7px 13px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--fg);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }

    .btn-secondary {
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--card-muted);
      color: var(--fg);
      font-size: 12.5px;
      cursor: pointer;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      padding: 12px 0 8px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .svg-wrap {
      width: 100%;
      overflow-x: auto;
      padding: 6px 0;
      border-radius: 10px;
      background: color-mix(in srgb, var(--card-muted) 45%, transparent);
      border: 1px solid var(--border);
    }

    svg {
      width: 100%;
      min-width: 960px;
      height: auto;
      display: block;
      user-select: none;
    }

    .node { cursor: pointer; }
    .node:hover rect.node-box,
    .node:hover polygon.node-box {
      filter: brightness(0.97);
    }
    html.dark .node:hover rect.node-box,
    html.dark .node:hover polygon.node-box {
      filter: brightness(1.1);
    }
    .node.active rect.node-box,
    .node.active polygon.node-box {
      stroke-width: 2.6;
    }

    /* Structured Selected Node Inspector */
    .inspector {
      margin-top: 14px;
      padding: 16px 18px;
      border-radius: 10px;
      background: var(--card-muted);
      border: 1px solid var(--border);
    }

    .inspector-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .inspector-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .inspector-title {
      font-size: 15.5px;
      font-weight: 700;
    }

    .badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 5px;
    }

    .path-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }

    .inspector-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .info-cell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .info-cell h4 {
      margin: 0 0 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .info-cell p, .info-cell ul {
      margin: 0;
      font-size: 13px;
      color: var(--fg);
    }

    .info-cell ul {
      padding-left: 16px;
    }

    .info-cell li {
      margin-bottom: 3px;
    }

    /* Full Breakdown Section Below Diagram */
    .section-header {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .section-header p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    .cards-list {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 12px;
    }

    .part-card {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      background: var(--card);
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .part-card:hover {
      border-color: var(--primary);
    }

    .part-card.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 18%, transparent);
    }

    .part-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .part-card-title {
      font-size: 14px;
      font-weight: 700;
    }

    .part-card-body {
      font-size: 12.8px;
      color: var(--muted);
    }

    .part-card-body strong {
      color: var(--fg);
    }

    .part-card-body ul {
      margin: 6px 0 0;
      padding-left: 16px;
    }

    .part-card-body li {
      margin-bottom: 3px;
    }

    .part-card-path {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: var(--placeholder);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>d:\Assistant（power-review）仓库全貌与分步详解</h1>
        <p>鸿蒙平板 DUBAI / XPower 功耗审单 Skill：审单流程、目录文件职责、待合入升级方案一图看清</p>
      </div>
      <div class="controls">
        <div class="tabs" role="tablist">
          <button id="tab-flow" class="tab-btn" onclick="switchView('flow')">1. 核心审单流程图</button>
          <button id="tab-arch" class="tab-btn" onclick="switchView('arch')">2. 仓库文件全景</button>
          <button id="tab-upgrade" class="tab-btn" onclick="switchView('upgrade')">3. 待合入升级链路</button>
        </div>
        <button class="btn-secondary" onclick="toggleTheme()">切换深浅色</button>
      </div>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="dot" style="background: var(--success);"></span>规则 / 模板已写明（可直接按此执行）</span>
      <span class="legend-item"><span class="dot" style="background: var(--warning);"></span>脚手架蓝图（目前只有 README，待回内网补 .py 代码）</span>
      <span class="legend-item"><span class="dot" style="background: var(--chart-4);"></span>升级方案待合入（已写完设计/源码，待整合进正式 Skill）</span>
    </div>

    <div class="svg-wrap">
      <svg id="diagram" viewBox="0 0 1160 440" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--muted)" />
          </marker>
          <marker id="arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--success)" />
          </marker>
          <marker id="arrow-up" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--chart-4)" />
          </marker>
          <marker id="arrow-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--chart-5)" />
          </marker>
        </defs>
        <g id="svg-stage"></g>
      </svg>
    </div>

    <!-- Rich Inspector for Currently Selected Node -->
    <div class="inspector">
      <div class="inspector-top">
        <div class="inspector-title-row">
          <span id="ins-title" class="inspector-title"></span>
          <span id="ins-badge" class="badge"></span>
        </div>
        <span id="ins-path" class="path-text"></span>
      </div>
      <div class="inspector-grid">
        <div class="info-cell">
          <h4>大白话：这一步 / 这部分干什么</h4>
          <p id="ins-what"></p>
        </div>
        <div class="info-cell">
          <h4>输入与输出（从哪来 → 到哪去）</h4>
          <p id="ins-io"></p>
        </div>
        <div class="info-cell">
          <h4>关键规则 / 核心数字 / 内部清单</h4>
          <ul id="ins-rules"></ul>
        </div>
      </div>
    </div>

    <!-- All Parts Breakdown List -->
    <div class="section-header">
      <div>
        <h2 id="list-heading">当前视角各部分逐项详解（一屏通读）</h2>
        <p>点击任意卡片可同步定位并高亮上方流程图中的对应节点</p>
      </div>
    </div>
    <div id="cards-list" class="cards-list"></div>
  </div>

  <script>
    const NODES = {
      // ================== VIEW 1: CORE FLOW ==================
      input: {
        view: 'flow',
        title: "0. 输入契约（$ARGUMENTS）",
        badge: "已定稿",
        color: "var(--chart-1)",
        path: ".claude/skills/power-review/SKILL.md（第 17~21 行）",
        what: "审单动作的唯一入口。每次只需要给单台出问题设备的数据库，不再依赖外部大盘基线；有日志就顺带查根因，没日志也能先凭数据库给出可疑对象和缺什么证据。",
        io: "外部输入：单机功耗 .db（必选）+ 设备运行日志目录 log_dir（可选）+ 工单背景/用户抱怨时间窗 context_ext（可选）。输出给：阶段一数据库切片器与阶段三日志检索。",
        rules: [
          "必选：单机功耗 SQLite 数据库（.db）",
          "可选：hilog / kernel_log 等设备运行日志目录",
          "可选：问题单号、报障时间窗、距 OTA 升级天数等背景说明",
          "待适配清单①：回内网需确认实际单子是单文件 .db 还是需先解压"
        ]
      },
      s1_probe: {
        view: 'flow',
        title: "1A. 探表自适应 & 电池切片选段（SQL_0_Battery）",
        badge: "蓝图待写 .py",
        color: "var(--warning)",
        path: "scripts/stage1_db/{probe,slicer} + assets/config/thresholds.json",
        what: "先扫描 .db 里到底有哪些表和字段（不同机型表结构可能缺字段，缺了就跳过或降级，不准报错中断）；然后过滤充电期间与拔充回落干扰，把整库切成干净的纯灭屏段和纯亮屏段，挑出所有超标异常段（Target_List）和同类型最省电的正常参照段（Ref）。",
        io: "输入：原始 .db + thresholds.json 阈值。输出：Target_1, Target_2, ... 异常切片清单 + 公共正常参照段 Ref（全库都在漏电时 Ref = 无）。",
        rules: [
          "探表：用 sqlite_master 和 PRAGMA table_info 先探后查；发现未预设的活跃新表按能量/时长/频次 3 类模板自动纳管",
          "切段过滤：剔除充电中（charge=1）和拔充后 300s 电压回落期",
          "最短切片：纯灭屏 >= 1800s（30 分钟），纯亮屏 >= 600s（10 分钟）",
          "异常红线：灭屏均流 >20mA 或掉电 >0.3%/h 或深睡 <80%；亮屏掉电 >12%/h 或均流 >1000mA 或后台 >25%"
        ]
      },
      s1_calc: {
        view: 'flow',
        title: "1B. 分枝取证（灭屏 7 槽 / 亮屏 8 槽）& 真模换算",
        badge: "蓝图待写 .py",
        color: "var(--warning)",
        path: "scripts/stage1_db/{slots,calculator} + plan.md",
        what: "根据切片是灭屏还是亮屏，按固定槽位抽指标，并严防“算错数”：硬件真实值（电流、深睡率、持锁时长、中断频次、线程 CPU%）和软件模拟电量（器件/应用能量 Share %）绝不混为一谈。",
        io: "输入：Target 切片和 Ref 切片的起止时间戳。输出：每段各维度的标准化 SlotResult 指标数据。",
        rules: [
          "灭屏 7 槽 (SQL_OFF_1~7)：L1 AP/子系统休眠+覆盖率 | L2 持锁+唤醒IRQ/Alarm+器件/后台Share% | L3 偷跑线程/网络扫描+外设(笔/键盘/霍尔/OTG)+异常事件栈",
          "亮屏 8 槽 (SQL_ON_1~8)：L1 器件Share%+覆盖率 | L2 亮度/LTPO/GPU-DSS+前台/分屏+后台陪跑 | L3 CPU线程核频点+GPU/DDR/ROM+网/音视频/外设+温升热降频",
          "防算错铁律：累加器必须段末减段初（MAX-MIN，禁 SUM）；覆盖率统一换算 mAs（1mAh=3600mAs, 1uAh=3.6mAs）且防父子行重复累加；仅靠电量 % 反推均流要标 [估算值]",
          "双榜合并去噪：实测大户榜（>=3% 或 >=3次/h，不足保底前5）∪ 突增榜（Target-Ref 降序 Top 3），其余合入 Others"
        ]
      },
      s2_ev: {
        view: 'flow',
        title: "2. 组装 4 列表证据包 & 双维度案例召回",
        badge: "模板就绪+蓝图",
        color: "var(--chart-2)",
        path: "scripts/stage2_evidence/ + assets/templates/evidence_pack_block.md + references/case_knowledge_base.md",
        what: "把阶段一算好的所有数据，拼成大模型最容易对比阅读的统一 4 列表格（嫌疑对象 | ①Target实测 | ②Ref参考 | ③Diff变化）；同时去案例库翻出最相关的历史经验卡片，省得大模型每次从零瞎摸。",
        io: "输入：各 Target 的 SlotResult + 历史案例库。输出：完整 Markdown 证据包 + 召回参考卡片，交给大模型做研判。",
        rules: [
          "缺失值规范：未采集、缺表或缺字段必须填「无数据」（不计算差值），严禁填 0",
          "双维召回：维度 A 按嫌犯包名/模块名/锁名精确匹配；维度 B 按同类异常槽位（如同样都是持锁超时）抽 2~3 张旧卡片供“照猫画虎”",
          "当前案例库状态：case_knowledge_base.md 目前含 2 个示范模板（SyncWake 持锁、手写笔无线复充震荡），待导入区暂空"
        ]
      },
      s3_branch: {
        view: 'flow',
        title: "3A. 按分支加载活文档 & 正常使用豁免筛查",
        badge: "活文档已写明",
        color: "var(--success)",
        path: "references/{general_guide.md, screen_off_rules.md, screen_on_rules.md}",
        what: "为了不浪费上下文，灭屏段只加载灭屏规则，亮屏段只加载亮屏规则。进入破案前先查“豁免白名单”——用户本来就在听歌、下载、打游戏或分屏办公时耗电高是正常的，但必须确认没有“无关后台趁机偷跑”才能放行。",
        io: "输入：阶段二证据包 + 对应分支规则文档。输出：决定该切片是“直接豁免关闭”，还是“进入下一步抓真凶”。",
        rules: [
          "灭屏豁免 3 类：熄屏听歌/语音（Audio>25%+音频App居首）、大流量真下载（吞吐高如>100MB/h，若只持锁不跑流量<5MB/h 严禁豁免）、手写笔单次正常快充（<45min 充停）",
          "亮屏豁免 4 类：高帧游戏、视频会议/网课、户外超高亮度（>80%）、真分屏多窗并发（须有时间重叠/窗口标记或前台总时长>1.2×Δt，防先后切换误判）",
          "豁免硬前提：必须同时确认无无关后台高耗电（<15%）、无异常长持锁/高频唤醒，全部通过才可整段豁免"
        ]
      },
      s3_exempt: {
        view: 'flow',
        title: "分支结果：判定为正常使用豁免",
        badge: "正常闭合",
        color: "var(--success)",
        path: "references/general_guide.md（第二章）",
        what: "确认用户处于合理重度场景，且底层没有任何无关异常陪跑。该切片不再浪费工具去查日志，直接记为正常使用场景，在报告末尾附一行说明即可。",
        io: "输入：通过白名单与无陪跑复核的切片。输出：进入阶段四写入正常豁免汇总。",
        rules: [
          "若同一份 .db 里既有正常段又有异常段（复合异常），只豁免正常段，严禁一刀切全单豁免"
        ]
      },
      s3_suspect: {
        view: 'flow',
        title: "3B. 覆盖率筛查 & 4 列表锁定头号嫌犯",
        badge: "核心推理规则",
        color: "var(--chart-3)",

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function measureBadgeWidth(text) {
      let w = 14;
      for (const ch of text) {
        w += /[\u4e00-\u9fff]/.test(ch) ? 11.5 : 6.8;
      }
      return Math.ceil(w);
    }

    function box(id, x, y, w, h, title, sub, accent, badgeText) {
      const bw = badgeText ? measureBadgeWidth(badgeText) : 0;
      return `
        <g class="node" data-id="${id}" onclick="selectNode('${id}')">
          <rect class="node-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="9"
            fill="color-mix(in srgb, ${accent} 10%, var(--card))"
            stroke="${accent}" stroke-width="1.5" />
          <rect x="${x}" y="${y}" width="6" height="${h}" rx="3" fill="${accent}" />
          ${badgeText ? `
            <rect x="${x + w - bw - 8}" y="${y + 7}" width="${bw}" height="18" rx="4"
              fill="color-mix(in srgb, ${accent} 18%, transparent)" />
            <text x="${x + w - 8 - bw / 2}" y="${y + 19.5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${accent}">${esc(badgeText)}</text>
          ` : ''}
          <text x="${x + 15}" y="${y + 23}" font-size="13.5" font-weight="700" fill="var(--fg)">${esc(title)}</text>
          ${sub.map((line, idx) => `
            <text x="${x + 15}" y="${y + 44 + idx * 17}" font-size="11.5" fill="var(--muted)">${esc(line)}</text>
          `).join('')}
        </g>
      `;
    }

    function diamond(id, cx, cy, hw, hh, title, sub, accent) {
      const pts = `${cx},${cy - hh} ${cx + hw},${cy} ${cx},${cy + hh} ${cx - hw},${cy}`;
      return `
        <g class="node" data-id="${id}" onclick="selectNode('${id}')">
          <polygon class="node-box" points="${pts}"
            fill="color-mix(in srgb, ${accent} 12%, var(--card))"
            stroke="${accent}" stroke-width="1.6" />
          <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fg)">${esc(title)}</text>
          <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(sub)}</text>
        </g>
      `;
    }

    function arrow(d, label, lx, ly, color = "var(--muted)", marker = "arrow", dashed = false) {
      return `
        <g>
          <path d="${d}" fill="none" stroke="${color}" stroke-width="1.7" ${dashed ? 'stroke-dasharray="5 3"' : ''} marker-end="url(#${marker})" />
          ${label ? `<text x="${lx}" y="${ly}" font-size="11" font-weight="700" fill="${color}" text-anchor="middle">${esc(label)}</text>` : ''}
        </g>
      `;
    }

        <div class="part-card" data-card-id="${esc(id)}" onclick="selectNode('${esc(id)}', true)">
          <div class="part-card-head">
            <span class="part-card-title">${esc(item.title)}</span>
            <span class="badge" style="background: color-mix(in srgb, ${item.color} 15%, transparent); color: ${item.color};">${esc(item.badge)}</span>
          </div>
          <div class="part-card-body">
            <div><strong>说明：</strong>${esc(item.what)}</div>
            <div style="margin-top:4px;"><strong>流转：</strong>${esc(item.io)}</div>
            <ul>
              ${item.rules.map(r => `<li>${esc(r)}</li>`).join('')}
            </ul>
          </div>
          <div class="part-card-path">${esc(item.path)}</div>
        </div>
      `).join('');
    }

    function selectNode(id, scrollUp = false) {
      currentNode = id;
      document.querySelectorAll('.node').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
      });
      document.querySelectorAll('.part-card').forEach(el => {
        el.classList.toggle('active', el.dataset.cardId === id);
      });

      const info = NODES[id];
      if (!info) return;

      document.getElementById('ins-title').textContent = info.title;
      const badge = document.getElementById('ins-badge');
      badge.textContent = info.badge;
      badge.style.backgroundColor = `color-mix(in srgb, ${info.color} 16%, transparent)`;
      badge.style.color = info.color;
      document.getElementById('ins-path').textContent = info.path;
      document.getElementById('ins-what').textContent = info.what;
      document.getElementById('ins-io').textContent = info.io;
      document.getElementById('ins-rules').innerHTML = info.rules.map(r => `<li>${esc(r)}</li>`).join('');

      if (scrollUp) {
        document.querySelector('.inspector').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    switchView('flow');
  </script>
</body>
</html>
